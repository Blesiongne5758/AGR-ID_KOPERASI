version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: koperasi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-koperasi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-koperasi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - koperasi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-koperasi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Server
  app:
    build: .
    container_name: koperasi_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-koperasi}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-koperasi_db}
      AGRID_BASE_URL: ${AGRID_BASE_URL:-https://agr.id}
      AGRID_API_TOKEN: ${AGRID_API_TOKEN}
      AGRID_SYNC_SCHEDULE: ${AGRID_SYNC_SCHEDULE:-0 2 * * *}
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - koperasi_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  koperasi_network:
    driver: bridge
